# Builds Desktop Pet for Windows and macOS on GitHub's own machines from the tagged source, so
# anyone can check where a download came from. Pushing a tag like v1.2.0 publishes a release with
# the Windows installer, the Mac disk images, their SHA-256 checksums and a signed build-provenance
# record. Each platform first runs the smoke test (scripts/smoke-test.js) against the source.
#
# Windows code signing through SignPath (free for open source) switches on once the repository has
# the SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret: the app's .exe is signed
# before it goes into the installer, then the installer itself. Until then Windows builds are
# unsigned. Mac builds are ad-hoc signed (not notarized: that needs a paid Apple developer account).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # a test build from any branch, kept as workflow artifacts

permissions:
  contents: write # create the release
  actions: read # SignPath fetches the files to sign
  id-token: write # build provenance
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Smoke test
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--require ./scripts/smoke-test.js'
          npx electron . --user-data-dir="$env:RUNNER_TEMP/pet-profile"

      - name: Build the app
        run: npx electron-builder --win --dir --publish never

      - name: Upload the app for signing
        if: env.SIGN == 'true'
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/win-unpacked/Desktop Pet.exe

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: desktop-pet
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # every release waits for your approval in SignPath
          output-artifact-directory: dist/win-unpacked

      - name: Build the installer
        run: npx electron-builder --win --prepackaged dist/win-unpacked --publish never

      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: installer-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/Desktop-Pet-Setup-*.exe

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: desktop-pet
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.SIGN == 'true' && 'dist/signed' || 'dist' }}/Desktop-Pet-Setup-*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Smoke test
        run: NODE_OPTIONS="--require ./scripts/smoke-test.js" npx electron . --user-data-dir="$RUNNER_TEMP/pet-profile"

      - name: Keep the smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-test
          path: smoke-test.png
          if-no-files-found: ignore

      - name: Build the app (Apple silicon and Intel)
        run: npx electron-builder --mac --publish never

      - name: Check the packaged app starts
        run: |
          app="dist/mac-arm64/Desktop Pet.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/Desktop Pet" --user-data-dir="$RUNNER_TEMP/pet-packaged" &
          pid=$!
          sleep 15
          kill -0 "$pid" # still running
          kill "$pid"

      - name: Keep the disk images
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Desktop-Pet-*.dmg
          if-no-files-found: error

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Record build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.dmg

      - name: Keep the files (test builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "Desktop Pet ${TAG#v}" --generate-notes
          fi
